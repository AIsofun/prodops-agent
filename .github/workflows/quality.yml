name: Product quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: M1 quality
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.2"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.1"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.17"
          enable-cache: false
      - name: Install locked Python dependencies
        run: uv sync --frozen --group dev --cache-dir .quality-reports/uv-cache --link-mode copy
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --cache .quality-reports/npm-cache
      - name: Run unified product checks
        run: python scripts/check.py --report .quality-reports/ci-checks.json
      - name: Verify real product defect rejection
        run: .venv/Scripts/python.exe -m scripts.verify_product_gates --report .quality-reports/ci-injections.json
      - name: Preserve check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-quality-${{ github.sha }}
          path: |
            .quality-reports/ci-checks.json
            .quality-reports/ci-injections.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
