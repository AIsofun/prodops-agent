[project]
name = "prodops-agent-tooling"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["mypy==1.19.0", "prodops-agent", "httpx2>=2,<3"]
packaging = [
    "pyinstaller==6.22.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/agent"]

[tool.uv.sources]
prodops-agent = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = ["scripts", "tests/harness"]
exclude = ["node_modules", ".venv"]
