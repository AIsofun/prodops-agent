[project]
name = "prodops-agent-tooling"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["mypy==1.19.0"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = ["scripts", "tests/harness"]
exclude = ["node_modules", ".venv"]
