[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prodops-agent"
version = "0.1.0"
description = "Shared local and server service for the ProdOps desktop agent"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.scripts]
prodops-agent = "prodops.bootstrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prodops"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["services/agent/src/prodops", "services/agent/tests"]
